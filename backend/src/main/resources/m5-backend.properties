# Project-owned non-secret configuration for M5BackendApplication.
# Secrets are resolved from the Git-ignored root .env by docs/scripts/Start-M5Backend.ps1.
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
fluxpay.jwt-secret=${JWT_SECRET}
server.address=127.0.0.1
server.port=8082
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=10
# Hibernate binds legacy Instant fields as UTC TIMESTAMP. Oracle must also use a UTC
# session when implicitly converting those binds into M3 TIMESTAMP WITH TIME ZONE columns.
# Applies to each new physical connection; restart M5 after changing this setting.
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET TIME_ZONE='UTC'
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Demo settings for the six implemented deterministic rules. These are not legal guidance.
compliance.high-value-thresholds.USD=1000
compliance.high-value-thresholds.EUR=920
compliance.high-value-thresholds.INR=83500
compliance.day-zone=Asia/Kolkata
compliance.recipient-today-mode=ALL_ATTEMPTS
compliance.high-risk-countries=KP,IR,SY,MM,RU,BY

# Exact Ollama embedding endpoint. The model must return 768 dimensions.
fluxpay.embedding-mode=ollama
embedding.url=http://localhost:11434/api/embed
embedding.model=nomic-embed-text
embedding.provider-version=local-nomic-v1
embedding.expected-dimensions=768
embedding.timeout-seconds=3
policy.chunk-min-words=400
policy.chunk-max-words=700
policy.chunk-overlap-words=50
policy.top-k=5
policy.max-distance=0.35

# System account owner from docs/sql/m5-backend-test-data.sql.
m5.integration.system-user-id=5f000000-0000-0000-0000-000000000002
fluxpay.fx-provider-url=https://api.frankfurter.dev/v1/latest
m5.review-delivery.enabled=true
m5.review-delivery.delay-ms=10000
