server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${ORACLE_JDBC_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Oracle stores the existing audit columns as TIMESTAMP (without a time-zone).
        # Avoid Hibernate's OffsetDateTime extraction, which fails against those columns.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
fluxpay:
  # Documented Frankfurter v1 /latest endpoint (see https://frankfurter.dev/v1/).
  # fluxpay.fx-mode/FLUXPAY_FX_MODE was retired: any value fails startup explicitly.
  fx-provider-url: ${FX_PROVIDER_URL:}
  # Compliance-vector mode; default is the production embedding path (no mock default).
  embedding-mode: ${EMBEDDING_MODE:live}
  m5:
    vector:
      ollama-base-url: ${M5_OLLAMA_BASE_URL:http://127.0.0.1:11434}
      embedding-model: ${M5_OLLAMA_EMBEDDING_MODEL:qwen3-embedding:4b}
      dimensions: ${M5_OLLAMA_EMBEDDING_DIMENSIONS:1536}
      embedding-space-id: ${M5_OLLAMA_EMBEDDING_SPACE_ID:ollama/qwen3-embedding:4b/1536}
      chunker-version: ${M5_POLICY_CHUNKER_VERSION:m5-sentence-v1}
  jwt-secret: ${JWT_SECRET}
  system-user-id: ${FLUXPAY_SYSTEM_USER_ID:}
  demo-funding-enabled: ${FLUXPAY_DEMO_FUNDING_ENABLED:false}
  development:
    kyc-metadata-enabled: ${FLUXPAY_DEVELOPMENT_KYC_METADATA_ENABLED:false}
    simulated-compliance-enabled: ${FLUXPAY_DEVELOPMENT_SIMULATED_COMPLIANCE_ENABLED:false}
    simulated-payouts-enabled: ${FLUXPAY_DEVELOPMENT_SIMULATED_PAYOUTS_ENABLED:false}
