server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${ORACLE_JDBC_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Oracle stores the existing audit columns as TIMESTAMP (without a time-zone).
        # Avoid Hibernate's OffsetDateTime extraction, which fails against those columns.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
fluxpay:
  fx-provider-url: ${FX_PROVIDER_URL}
  embedding-mode: ${EMBEDDING_MODE:mock}
  jwt-secret: ${JWT_SECRET}
