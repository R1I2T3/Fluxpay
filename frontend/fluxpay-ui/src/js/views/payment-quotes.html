<section class="fp-screen"><div class="fp-page-heading"><div><h2>Compare quotes</h2><p>Step 2 of 2 — select one route before confirming your payment.</p></div><div class="fp-countdown">Quote expires in <strong data-bind="text: secondsRemaining"></strong>s</div></div><p class="fp-error" data-bind="visible: error, text: error"></p><p data-bind="visible: result, text: result() && result().recommendationReason"></p><div class="fp-quote-grid" data-bind="foreach: result() && result().quotes"><article class="fp-card fp-quote" data-bind="css: { 'fp-recommended': recommended }"><span class="fp-chip fp-chip-success" data-bind="visible: recommended">Recommended</span><h3 data-bind="text: route"></h3><dl><dt>Recipient receives</dt><dd data-bind="text: recipientAmount"></dd><dt>Offered rate</dt><dd data-bind="text: offeredRate"></dd><dt>Fee</dt><dd data-bind="text: feeAmount"></dd><dt>ETA</dt><dd data-bind="text: estimatedMinutes + ' minutes'"></dd></dl><oj-radio-set value="{{$parent.selectedQuoteId}}"><oj-option data-bind="attr: { value: id }">Select this route</oj-option></oj-radio-set></article></div><oj-button chroming="callToAction" on-oj-action="[[confirm]]" disabled="[[!selectedQuoteId() || secondsRemaining() === 0 || busy]]">Confirm selected quote</oj-button></section>
