<section class="fp-screen"><div class="fp-page-heading"><div><span class="fp-eyebrow">IDENTITY</span><h2>Verify your account</h2><p>Secure transfers begin with a verified identity.</p></div></div><p class="fp-error" data-bind="visible:error,text:error"></p><div class="fp-grid-2"><div class="fp-card"><h3>Verification status</h3><div class="fp-status-panel"><strong data-bind="text:status() ? status().status : 'NOT STARTED'"></strong><p data-bind="text:status() && (status().rejectReason || 'We will notify you after review.')"></p></div></div><div class="fp-card"><h3>Submit identity document</h3><oj-form-layout max-columns="1"><oj-select-single label-hint="Document type" value="{{docType}}"><oj-option value="PAN">PAN</oj-option><oj-option value="AADHAAR">Aadhaar</oj-option><oj-option value="PASSPORT">Passport</oj-option><oj-option value="DRIVING_LICENSE">Driving licence</oj-option></oj-select-single><oj-input-text label-hint="Document number" value="{{docNumber}}"></oj-input-text><oj-input-text label-hint="File name" value="{{fileName}}"></oj-input-text></oj-form-layout><oj-button chroming="callToAction" on-oj-action="[[submit]]">Submit for verification</oj-button></div></div></section>
