<section class="fp-screen"><div class="fp-page-heading"><div><span class="fp-eyebrow">ADMIN CONSOLE</span><h2>Risk & route controls</h2><p>Review KYC applications and fine-tune payout route performance.</p></div><oj-button on-oj-action="[[load]]">Refresh</oj-button></div><p class="fp-error" data-bind="visible:error,text:error"></p><p class="fp-notice" data-bind="visible:notice,text:notice"></p><div class="fp-card"><h3>Pending identity reviews</h3><oj-input-text label-hint="Decision note" value="{{reason}}"></oj-input-text><table class="fp-table"><thead><tr><th>Customer</th><th>Document</th><th>Submitted</th><th>Decision</th></tr></thead><tbody data-bind="foreach:cases"><tr><td><strong data-bind="text:fullName"></strong><br><small data-bind="text:email"></small></td><td data-bind="text:docType + ' · ' + docNumber"></td><td data-bind="text:submittedAt"></td><td><oj-button on-oj-action="[[$parent.decide.bind($parent,$data,true)]]">Approve</oj-button><oj-button on-oj-action="[[$parent.decide.bind($parent,$data,false)]]">Reject</oj-button></td></tr></tbody></table></div><div class="fp-card"><h3>Payout route catalogue</h3><table class="fp-table"><thead><tr><th>Route</th><th>Base fee</th><th>Speed</th><th>Success rate</th><th>Status</th><th></th></tr></thead><tbody data-bind="foreach:routes"><tr><td><strong data-bind="text:routeName"></strong><br><small data-bind="text:providerName"></small></td><td data-bind="text:baseFee"></td><td data-bind="text:estimatedMinutes + ' min'"></td><td data-bind="text:successRate + '%'"></td><td data-bind="text:active ? 'ACTIVE' : 'PAUSED'"></td><td><oj-button on-oj-action="[[$parent.saveRoute.bind($parent,$data)]]">Save</oj-button></td></tr></tbody></table></div></section>
