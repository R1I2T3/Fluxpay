<section class="fp-screen"><div class="fp-page-heading"><div><span class="fp-eyebrow">LIQUIDITY</span><h2>Your multi-currency wallet</h2><p>Add money, view your wallet activity, and exchange in one place.</p></div><oj-button on-oj-action="[[load]]">Refresh balances</oj-button></div><p class="fp-error" data-bind="visible:error,text:error"></p><p class="fp-notice" data-bind="visible:notice,text:notice"></p><div class="fp-wallet-grid" data-bind="foreach:wallets"><article class="fp-wallet" data-bind="click:$parent.showLedger"><span data-bind="text:currency"></span><strong data-bind="text:availableBalance"></strong><small>Available · held <span data-bind="text:heldBalance"></span></small></article></div><div class="fp-grid-2"><div class="fp-card"><h3>Add money</h3><oj-form-layout max-columns="2"><oj-select-single label-hint="Currency" value="{{fundCurrency}}"><oj-option value="USD">USD</oj-option><oj-option value="EUR">EUR</oj-option><oj-option value="INR">INR</oj-option></oj-select-single><oj-input-number label-hint="Amount" value="{{fundAmount}}" min="1"></oj-input-number></oj-form-layout><oj-button chroming="callToAction" on-oj-action="[[fund]]">Receive funds</oj-button></div><div class="fp-card"><h3>Convert currency</h3><oj-form-layout max-columns="3"><oj-select-single label-hint="From" value="{{from}}" on-value-changed="[[refreshRate]]"><oj-option value="USD">USD</oj-option><oj-option value="EUR">EUR</oj-option><oj-option value="INR">INR</oj-option></oj-select-single><oj-select-single label-hint="To" value="{{to}}" on-value-changed="[[refreshRate]]"><oj-option value="INR">INR</oj-option><oj-option value="USD">USD</oj-option><oj-option value="EUR">EUR</oj-option></oj-select-single><oj-input-number label-hint="Amount" value="{{convertAmount}}" min="1"></oj-input-number></oj-form-layout><p class="fp-rate" data-bind="visible:rate,text:rate() ? 'Live rate: 1 ' + rate().from + ' = ' + rate().rate + ' ' + rate().to : ''"></p><oj-button chroming="callToAction" on-oj-action="[[convert]]">Convert now</oj-button></div></div><div class="fp-card" data-bind="visible:ledger().length"><h3>Wallet ledger</h3><table class="fp-table"><thead><tr><th>Type</th><th>Amount</th><th>Reference</th><th>When</th></tr></thead><tbody data-bind="foreach:ledger"><tr><td data-bind="text:entryType"></td><td data-bind="text:amount + ' ' + currency"></td><td data-bind="text:narration"></td><td data-bind="text:createdAt"></td></tr></tbody></table></div></section>
