<section class="fp-screen"><div class="fp-page-heading"><div><span class="fp-eyebrow">NEW TRANSFER</span><h2>Send with a smarter route</h2><p>Select a funded wallet and beneficiary; FluxPay returns live quotes built for your preference.</p></div></div><p class="fp-error" data-bind="visible:error,text:error"></p><p class="fp-notice" data-bind="visible:notice,text:notice"></p><div class="fp-card fp-form"><oj-form-layout max-columns="2"><oj-select-single label-hint="Pay from wallet" value="{{sourceWalletId}}"><oj-bind-for-each data="[[wallets]]"><template><oj-option :value="[[$current.data.walletId]]"><oj-bind-text value="[[$current.data.currency + ' · ' + $current.data.availableBalance]]"></oj-bind-text></oj-option></template></oj-bind-for-each></oj-select-single><oj-select-single label-hint="Send to beneficiary" value="{{recipientId}}"><oj-bind-for-each data="[[recipients]]"><template><oj-option :value="[[$current.data.id]]"><oj-bind-text value="[[$current.data.name + ' · ' + $current.data.currency]]"></oj-bind-text></oj-option></template></oj-bind-for-each></oj-select-single><oj-input-number label-hint="Amount" value="{{amount}}" min="0.0001"></oj-input-number><oj-select-single label-hint="Payout currency" value="{{payoutCurrency}}"><oj-option value="INR">INR</oj-option><oj-option value="EUR">EUR</oj-option><oj-option value="USD">USD</oj-option></oj-select-single><oj-select-single label-hint="Purpose" value="{{purpose}}"><oj-option value="FAMILY_SUPPORT">Family support</oj-option><oj-option value="EDUCATION">Education</oj-option><oj-option value="BUSINESS">Business</oj-option><oj-option value="SAVINGS">Savings</oj-option></oj-select-single><oj-select-single label-hint="Route preference" value="{{preference}}"><oj-option value="CHEAPEST">Best recipient amount</oj-option><oj-option value="BALANCED">Balanced</oj-option><oj-option value="FASTEST">Fastest</oj-option></oj-select-single></oj-form-layout><oj-button chroming="callToAction" on-oj-action="[[continueToQuotes]]">Compare protected quotes</oj-button></div><div data-bind="visible:quotes().length" class="fp-quote-grid"><div data-bind="foreach:quotes"><article class="fp-card fp-quote"><span class="fp-eyebrow" data-bind="visible:recommended">RECOMMENDED</span><h3 data-bind="text:route"></h3><strong data-bind="text:recipientAmount + ' ' + $parent.payoutCurrency()"></strong><dl><dt>Fee</dt><dd data-bind="text:feeAmount"></dd><dt>Rate</dt><dd data-bind="text:offeredRate"></dd><dt>Arrival</dt><dd data-bind="text:estimatedMinutes + ' min'"></dd></dl><oj-button chroming="callToAction" on-oj-action="[[$parent.confirm.bind($parent,$data)]]">Choose this quote</oj-button></article></div></div></section>
