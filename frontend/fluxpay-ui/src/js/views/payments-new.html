<section class="fp-screen"><div class="fp-page-heading"><div><h2>Send money</h2><p>Step 1 of 2 — enter payment details to compare live route quotes.</p></div></div><p class="fp-error" data-bind="visible: error, text: error"></p><div class="fp-card fp-form"><oj-form-layout max-columns="2"><oj-input-text label-hint="Source wallet ID" value="{{sourceWalletId}}" required></oj-input-text><oj-input-text label-hint="Recipient ID" value="{{recipientId}}" required></oj-input-text><oj-input-number label-hint="Amount" value="{{amount}}" min="0.0001" required></oj-input-number><oj-select-single label-hint="Source currency" value="{{sourceCurrency}}"><oj-option value="USD">USD</oj-option><oj-option value="EUR">EUR</oj-option><oj-option value="INR">INR</oj-option></oj-select-single><oj-select-single label-hint="Payout currency" value="{{payoutCurrency}}"><oj-option value="INR">INR</oj-option><oj-option value="EUR">EUR</oj-option><oj-option value="USD">USD</oj-option></oj-select-single><oj-select-single label-hint="Purpose" value="{{purpose}}"><oj-option value="FAMILY_SUPPORT">Family support</oj-option><oj-option value="EDUCATION">Education</oj-option><oj-option value="BUSINESS">Business</oj-option><oj-option value="SAVINGS">Savings</oj-option></oj-select-single><oj-select-single label-hint="Route preference" value="{{preference}}"><oj-option value="CHEAPEST">Best recipient amount</oj-option><oj-option value="BALANCED">Balanced</oj-option><oj-option value="FASTEST">Fastest</oj-option></oj-select-single></oj-form-layout><oj-button chroming="callToAction" on-oj-action="[[continueToQuotes]]" disabled="[[busy]]">Continue to quotes</oj-button></div></section>
