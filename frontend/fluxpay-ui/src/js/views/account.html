<section class="fp-screen"><div class="fp-page-heading"><div><span class="fp-eyebrow">ACCOUNT</span><h2>Your FluxPay profile</h2><p>Keep personal details and verification readiness in one place.</p></div></div><p class="fp-error" data-bind="visible:error,text:error"></p><div class="fp-grid-2"><div class="fp-card"><h3>Personal information</h3><oj-form-layout max-columns="1"><oj-input-text label-hint="Full name" value="{{fullName}}"></oj-input-text><oj-input-text label-hint="Email" readonly value="{{me() && me().email}}"></oj-input-text></oj-form-layout><oj-button chroming="callToAction" on-oj-action="[[save]]">Save changes</oj-button></div><div class="fp-card"><h3>Verification</h3><div class="fp-status-panel"><strong data-bind="text:kyc() ? kyc().status : (me() && me().kycStatus)"></strong><p data-bind="text:kyc() ? 'Submitted ' + kyc().submittedAt : 'Complete identity verification to unlock transfers.'"></p><a href="#kyc">Manage verification →</a></div></div></div></section>
