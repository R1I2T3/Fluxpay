<section class="fp-auth"><div class="fp-auth-card"><span class="fp-eyebrow">GET STARTED</span><h2>Create your FluxPay account</h2><p>Join the modern way to send money worldwide.</p><p class="fp-error" data-bind="visible:error,text:error"></p><oj-form-layout max-columns="1"><oj-input-text label-hint="Full name" value="{{fullName}}"></oj-input-text><oj-input-text label-hint="Email" value="{{email}}"></oj-input-text><oj-input-password label-hint="Password" value="{{password}}"></oj-input-password></oj-form-layout><oj-button chroming="callToAction" on-oj-action="[[submit]]">Create account</oj-button><p>Already registered? <a href="#login">Sign in</a></p></div></section>
